# Pruebas reales en navegador (Chromium + FFmpeg) en cada cambio. Minutos de Actions gratis en repos públicos.
name: Pruebas YOHA VIDEO
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: node tests/unit.mjs
      - name: Crear medios de prueba sintéticos
        run: bash scripts/make-test-media.sh test-media
      - run: MEDIA=test-media node tests/run.mjs
      - name: Productora IA en la app (API de GitHub simulada)
        run: node tests/productora.mjs test-media/clip_h.mp4
      - name: Motor de Safari (iPhone)
        run: MEDIA=test-media node tests/webkit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: resultados, path: test-output/ }
